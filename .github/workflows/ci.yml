name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_verified_business_evidence.py
      - name: Commit generated evidence registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/verified_business_evidence.csv benchmarks/evidence_migration_rejections.csv
          if ! git diff --cached --quiet; then
            git commit -m "data(v3.7): refresh generated evidence registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: python -m pytest -q
